name: Error
description: Informar de un problema sin incluir datos privados
body:
  - type: input
    id: versions
    attributes:
      label: Versiones de Home Assistant y VE Builder Card
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos, resultado esperado y resultado observado
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuración mínima sin datos personales
      render: yaml
