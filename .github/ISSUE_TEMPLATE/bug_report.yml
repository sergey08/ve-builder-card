name: Bug report / Error
description: Report a problem without private data / Informa de un problema sin datos privados
body:
  - type: input
    id: versions
    attributes:
      label: Home Assistant and card versions / Versiones de Home Assistant y la tarjeta
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected and actual result / Pasos, resultado esperado y observado
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal configuration without private data / Configuración mínima sin datos privados
      render: yaml
