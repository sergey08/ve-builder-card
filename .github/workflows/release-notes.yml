name: Sync release notes
on:
  push:
    branches: [main]
    paths: ['docs/RELEASE-*.md', '.github/workflows/release-notes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release notes only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          TAG="v$VERSION"
          NOTES="docs/RELEASE-$VERSION.md"
          test -f "$NOTES"
          gh release view "$TAG" >/dev/null
          gh release edit "$TAG" --title "VE Builder Card $VERSION" --notes-file "$NOTES"
