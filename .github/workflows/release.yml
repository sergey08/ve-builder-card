# Validate the complete source tree before publishing.
name: Release
on:
  push:
    branches: [main, "beta/**"]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ve-builder-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: git diff --exit-code -- dist/
      - name: Publish numbered release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag and package version must match"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          OPTIONS=()
          if [[ "$VERSION" == *-* ]]; then OPTIONS+=(--prerelease); fi
          NOTES="docs/RELEASE-$VERSION.md"
          if [[ -f "$NOTES" ]]; then
            OPTIONS+=(--notes-file "$NOTES")
          else
            OPTIONS+=(--generate-notes)
          fi
          gh release create "$TAG" dist/ve-builder-card.js --target "$RELEASE_SHA" --title "VE Builder Card $VERSION" "${OPTIONS[@]}"
