name: Build isolated VE Builder Card DEV
on:
  workflow_dispatch:
jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checks
        run: npm run check
      - name: Create isolated DEV card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/ve-builder-card.js')
          s = p.read_text()
          s = s.replace("'ve-builder-card-editor'", "'ve-builder-card-dev-editor'")
          s = s.replace("'ve-builder-card'", "'ve-builder-card-dev'")
          s = s.replace("'custom:ve-builder-card'", "'custom:ve-builder-card-dev'")
          s = s.replace("type==='ve-builder-card'", "type==='ve-builder-card-dev'")
          s = s.replace("name:'VE Builder Card · EV'", "name:'VE Builder Card DEV · EV'")
          p2 = Path('dist/ve-builder-card-dev.js')
          p2.write_text(s)
          assert "customElements.define('ve-builder-card-dev'" in s
          assert "customElements.define('ve-builder-card-dev-editor'" in s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ve-builder-card-dev
          path: dist/ve-builder-card-dev.js
          retention-days: 7
